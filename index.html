          {rows.map((r) => {
            const score = r.entry ? overallScore(r.entry) : null;
            const lbl = healthLabel(score);
            const pf = pfLabel(r.energy?.mainPf);
            const zoneData = zoneByDate[r.date];
            const totalKwh = zoneData ? plantTotalKwh(zoneData) : null;
            return (
              <tr key={r.date} className="border-t" style={{ borderColor: "#F0F2F5" }}>
                <td className="px-4 py-2.5 font-medium" style={{ color: "#16232E" }}>{r.date}</td>
                <td className="px-4 py-2.5"><span style={{ color: lbl.color }}>{score === null ? "–" : `${score}%`}</span></td>
                <td className="px-4 py-2.5" style={{ color: MUTED }}>{totalKwh !== null ? `${totalKwh.toLocaleString()} kWh` : "-"}</td>
                <td className="px-4 py-2.5" style={{ color: MUTED }}>{r.energy?.peak || "-"} kW</td>
                <td className="px-4 py-2.5" style={{ color: pf.color }}>{r.energy?.mainPf || "-"}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}
// ---------------------------------------------------------------------------
// Main App
// ---------------------------------------------------------------------------
function UtilityHealthApp() {
  const [tab, setTab] = useState("dashboard");
  const [inspectView, setInspectView] = useState("detail"); // detail | grid
  const [selectedDate, setSelectedDate] = useState(todayStr());
  const [entry, setEntry] = useState(emptyEntry());
  const [energy, setEnergy] = useState(emptyPlantEnergy());
  const [zoneEnergy, setZoneEnergyState] = useState({});
  const [config, setConfig] = useState(DEFAULT_ENERGY_CONFIG);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);
  const [openCats, setOpenCats] = useState(() => Object.fromEntries(CATEGORIES.map((c) => [c.key, false])));
  const [historyEntries, setHistoryEntries] = useState([]);
  const [zoneEnergyHistory, setZoneEnergyHistory] = useState([]);
  const [latestEntry, setLatestEntry] = useState(null);
  const [latestEnergy, setLatestEnergy] = useState(null);
  const [latestZoneEnergy, setLatestZoneEnergy] = useState(null);
  const [bessEntry, setBessEntryState] = useState(emptyBessEntry());
  const [bessHistory, setBessHistory] = useState([]);

  // Monthly grid state
  const today = new Date();
  const [gridYear, setGridYear] = useState(today.getFullYear());
  const [gridMonth, setGridMonth] = useState(today.getMonth() + 1);
  const [gridCategoryKey, setGridCategoryKey] = useState(CATEGORIES[0].key);
  const [monthEntries, setMonthEntries] = useState({});
  const [monthLoading, setMonthLoading] = useState(true);
  const [savingCell, setSavingCell] = useState(null);

  // Load the shared engineering config once on mount
  useEffect(() => {
    (async () => {
      const c = await safeGet("config:energy");
      if (c) setConfig({ ...DEFAULT_ENERGY_CONFIG, ...c });
    })();
  }, []);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setLoading(true);
      const [e, en, ze, be] = await Promise.all([
        safeGet(`inspection:${selectedDate}`),
        safeGet(`energy:${selectedDate}`),
        safeGet(`zoneenergy:${selectedDate}`),
        safeGet(`bess:${selectedDate}`),
      ]);
      if (cancelled) return;
      setEntry(e || emptyEntry());
      setEnergy(en || emptyPlantEnergy());
      setZoneEnergyState(ze || {});
      setBessEntryState(be || emptyBessEntry());
      setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [selectedDate]);

  const refreshHistory = useCallback(async () => {
    const [inspDates, energyDates, zoneDates] = await Promise.all([
      listRecentDates("inspection:", 30),
      listRecentDates("energy:", 30),
      listRecentDates("zoneenergy:", 30),
    ]);
    const allDates = Array.from(new Set([...inspDates, ...energyDates])).sort();
    const rows = await Promise.all(
      allDates.map(async (d) => ({
        date: d,
        entry: await safeGet(`inspection:${d}`),
        energy: await safeGet(`energy:${d}`),
      }))
    );
    setHistoryEntries(rows);
    const lastWithEntry = [...rows].reverse().find((r) => r.entry);
    const lastWithEnergy = [...rows].reverse().find((r) => r.energy);
    setLatestEntry(lastWithEntry || null);
    setLatestEnergy(lastWithEnergy || null);

    const zoneRows = await Promise.all(
      zoneDates.map(async (d) => ({ date: d, data: await safeGet(`zoneenergy:${d}`) }))
    );
    setZoneEnergyHistory(zoneRows);
    const lastWithZone = [...zoneRows].reverse().find((r) => r.data && Object.keys(r.data).length > 0);
    setLatestZoneEnergy(lastWithZone || null);

    const bessDates = await listRecentDates("bess:", 30);
    const bessRows = await Promise.all(
      bessDates.map(async (d) => ({ date: d, data: await safeGet(`bess:${d}`) }))
    );
    setBessHistory(bessRows.filter((r) => r.data));
  }, []);

  useEffect(() => { refreshHistory(); }, [refreshHistory]);

  // Load the whole selected month for the grid tab
  const loadMonth = useCallback(async (year, month) => {
    setMonthLoading(true);
    const n = daysInMonth(year, month);
    const dates = Array.from({ length: n }, (_, i) => ymd(year, month, i + 1));
    const results = await Promise.all(dates.map((d) => safeGet(`inspection:${d}`)));
    const map = {};
    dates.forEach((d, i) => { if (results[i]) map[d] = results[i]; });
    setMonthEntries(map);
    setMonthLoading(false);
  }, []);

  useEffect(() => { loadMonth(gridYear, gridMonth); }, [gridYear, gridMonth, loadMonth]);

  const setYearMonth = (y, m) => { setGridYear(y); setGridMonth(m); };

  const setResult = (unitCode, itemId, value) => {
    setEntry((prev) => {
      const results = { ...prev.results, [unitCode]: { ...prev.results[unitCode], [itemId]: value } };
      if (value === undefined) delete results[unitCode][itemId];
      return { ...prev, results };
    });
  };
  const setSimpleStatus = (unitCode, value) => {
    setEntry((prev) => ({
      ...prev,
      simpleStatus: { ...prev.simpleStatus, [unitCode]: prev.simpleStatus[unitCode] === value ? undefined : value },
    }));
  };
  const setNote = (unitCode, value) => {
    setEntry((prev) => ({ ...prev, notes: { ...prev.notes, [unitCode]: value } }));
  };
  const setValue = (unitCode, itemId, value) => {
    setEntry((prev) => ({
      ...prev,
      notes: { ...prev.notes, [unitCode]: { ...(typeof prev.notes[unitCode] === "object" ? prev.notes[unitCode] : {}), [itemId]: value } },
    }));
  };
  // Granular per-zone, per-system setters — the single place zone energy is edited.
  const setZoneSystem = (zoneKey, systemKey, value) => {
    setZoneEnergyState((prev) => {
      const zone = prev[zoneKey] || emptyZoneEnergy();
      return { ...prev, [zoneKey]: { ...zone, systems: { ...zone.systems, [systemKey]: value } } };
    });
  };
  const setZonePf = (zoneKey, value) => {
    setZoneEnergyState((prev) => {
      const zone = prev[zoneKey] || emptyZoneEnergy();
      return { ...prev, [zoneKey]: { ...zone, pf: value } };
    });
  };
  const setBessField = (unitCode, field, value) => {
    setBessEntryState((prev) => ({
      ...prev,
      [unitCode]: { ...(prev[unitCode] || emptyBessUnitEntry()), [field]: value },
    }));
  };

  const handleSaveEntry = async () => {
    setSaving(true);
    try {
      await safeSet(`inspection:${selectedDate}`, entry);
      await refreshHistory();
      setMonthEntries((prev) => ({ ...prev, [selectedDate]: entry }));
      setToast("บันทึกผลตรวจแล้ว — ทีมทั้งหมดจะเห็นข้อมูลนี้");
    } finally {
      setSaving(false);
    }
  };

  // One button saves the plant-wide meter reading AND the per-zone/system
  // breakdown together, since both describe the same day's energy picture.
  const handleSaveAllEnergy = async () => {
    setSaving(true);
    try {
      await Promise.all([
        safeSet(`energy:${selectedDate}`, energy),
        safeSet(`zoneenergy:${selectedDate}`, zoneEnergy),
      ]);
      await refreshHistory();
      setToast("บันทึกข้อมูลพลังงานของวันนี้แล้ว (รวมรายโซน) — ทีมทั้งหมดจะเห็นข้อมูลนี้");
    } finally {
      setSaving(false);
    }
  };

  const handleSaveBess = async () => {
    setSaving(true);
    try {
      await safeSet(`bess:${selectedDate}`, bessEntry);
      await refreshHistory();
      setToast("บันทึกข้อมูล BESS ของวันนี้แล้ว — ทีมทั้งหมดจะเห็นข้อมูลนี้");
    } finally {
      setSaving(false);
    }
  };

  const handleSaveConfig = async () => {
    setSaving(true);
    try {
      await safeSet("config:energy", config);
      setToast("บันทึกการตั้งค่าพารามิเตอร์วิศวกรรมพลังงานแล้ว");
    } finally {
      setSaving(false);
    }
  };

  // Quick-tick a single unit's status for a single day directly from the monthly grid.
  const handleToggleCell = async (dateStr, category, unitCode) => {
    const cellKey = `${dateStr}__${unitCode}`;
    const current = monthEntries[dateStr] || emptyEntry();
    const currentStatus = computeUnitStatus(category, unitCode, current);
    const next = currentStatus === "ok" ? "fail" : currentStatus === "fail" ? "unchecked" : "ok";

    const updated = {
      ...current,
      simpleStatus: { ...current.simpleStatus, [unitCode]: next === "unchecked" ? undefined : next },
    };

    setMonthEntries((prev) => ({ ...prev, [dateStr]: updated }));
    setSavingCell(cellKey);
    try {
      await safeSet(`inspection:${dateStr}`, updated);
      if (dateStr === selectedDate) setEntry(updated);
      await refreshHistory();
    } finally {
      setSavingCell(null);
    }
  };

  const dashboardScore = overallScore(latestEntry?.entry);
  const dashboardLabel = healthLabel(dashboardScore);

  const trendData = useMemo(
    () =>
      historyEntries.map((r) => ({
        date: fmtShort(r.date),
        health: r.entry ? overallScore(r.entry) : null,
        pf: r.energy?.mainPf ? parseFloat(r.energy.mainPf) : null,
      })),
    [historyEntries]
  );

  const goInspect = () => {
    setTab("inspect");
    setInspectView("detail");
    setOpenCats(Object.fromEntries(CATEGORIES.map((c) => [c.key, true])));
  };

  const gridCategory = CATEGORIES.find((c) => c.key === gridCategoryKey) || CATEGORIES[0];

  const tabs = [
    { key: "dashboard", label: "ภาพรวม", icon: LayoutDashboard },
    { key: "inspect", label: "บันทึกผลตรวจ", icon: ClipboardList },
    { key: "energy", label: "บันทึกพลังงาน", icon: MapPinned },
    { key: "bess", label: "กักเก็บพลังงาน", icon: BatteryCharging },
    { key: "plantdash", label: "แดชบอร์ดพลังงานโรงงาน", icon: Factory },
    { key: "history", label: "ประวัติ/แนวโน้ม", icon: HistoryIcon },
  ];

  return (
    <div className="min-h-screen w-full" style={{ backgroundColor: BG, fontFamily: "system-ui, -apple-system, sans-serif" }}>
      <div style={{ background: `linear-gradient(135deg, ${NAVY} 0%, #123A5E 60%, #1B4670 100%)` }} className="text-white">
        <div className="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between flex-wrap gap-4">
          <div className="flex items-center gap-3">
            <div
              className="w-12 h-12 rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0 shadow-lg"
              style={{ background: `linear-gradient(135deg, ${AMBER}, #D98A0F)`, color: NAVY }}
            >
              PJW
            </div>
            <div>
              <h1 className="text-lg font-semibold leading-tight">ระบบติดตามสุขภาพยูทิลิตี้ &amp; พลังงาน</h1>
              <p className="text-xs" style={{ color: "#9FB4C7" }}>Utility Health &amp; Energy Tracker — PJW Auto EV</p>
            </div>
          </div>
          <ScoreRing score={dashboardScore} size={88} />
        </div>
        <div className="max-w-6xl mx-auto px-6 flex gap-1 border-t overflow-x-auto" style={{ borderColor: "#22405E" }}>
          {tabs.map((t) => {
            const Icon = t.icon;
            const active = tab === t.key;
            return (
              <button
                key={t.key}
                onClick={() => setTab(t.key)}
                className="flex items-center gap-2 px-4 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap flex-shrink-0"
                style={{ borderColor: active ? AMBER : "transparent", color: active ? "#FFFFFF" : "#9FB4C7" }}
              >
                <Icon size={15} />
                {t.label}
              </button>
            );
          })}
        </div>
      </div>

      <div className="max-w-6xl mx-auto px-6 py-6">
        {tab === "dashboard" && (
          <DashboardTab
            latestEntry={latestEntry}
            latestEnergy={latestEnergy}
            latestZoneEnergy={latestZoneEnergy}
            dashboardScore={dashboardScore}
            dashboardLabel={dashboardLabel}
            trendData={trendData}
            onGoInspect={goInspect}
          />
        )}

        {tab === "inspect" && (
          <div className="space-y-4">
            <Card padded={false} className="flex gap-1 p-1.5 w-fit">
              <button
                onClick={() => setInspectView("detail")}
                className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-medium"
                style={inspectView === "detail" ? { backgroundColor: `${NAVY}0F`, color: NAVY } : { color: MUTED }}
              >
                <ClipboardList size={14} /> รายละเอียด/รายเครื่อง
              </button>
              <button
                onClick={() => setInspectView("grid")}
                className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-medium"
                style={inspectView === "grid" ? { backgroundColor: `${NAVY}0F`, color: NAVY } : { color: MUTED }}
              >
                <CalendarDays size={14} /> ตารางรายเดือน
              </button>
            </Card>

            {inspectView === "detail" ? (
              <InspectTab
                selectedDate={selectedDate}
                setSelectedDate={setSelectedDate}
                entry={entry}
                setResult={setResult}
                setSimpleStatus={setSimpleStatus}
                setNote={setNote}
                setValue={setValue}
                openCats={openCats}
                setOpenCats={setOpenCats}
                onSave={handleSaveEntry}
                saving={saving}
                loading={loading}
              />
            ) : (
              <MonthlyGridTab
                year={gridYear}
                month={gridMonth}
                setYearMonth={setYearMonth}
                category={gridCategory}
                setCategoryKey={setGridCategoryKey}
                monthEntries={monthEntries}
                loading={monthLoading}
                onToggleCell={handleToggleCell}
                savingCell={savingCell}
              />
            )}
          </div>
        )}

        {tab === "energy" && (
          <EnergyEntryTab
            selectedDate={selectedDate}
            setSelectedDate={setSelectedDate}
            energy={energy}
            setEnergy={setEnergy}
            zoneEnergy={zoneEnergy}
            setZoneSystem={setZoneSystem}
            setZonePf={setZonePf}
            config={config}
            setConfig={setConfig}
            onSaveConfig={handleSaveConfig}
            onSaveAll={handleSaveAllEnergy}
            saving={saving}
            loading={loading}
          />
        )}

        {tab === "bess" && (
          <BessTab
            selectedDate={selectedDate}
            setSelectedDate={setSelectedDate}
            bessEntry={bessEntry}
            setBessField={setBessField}
            bessHistory={bessHistory}
            onSave={handleSaveBess}
            saving={saving}
            loading={loading}
          />
        )}

        {tab === "plantdash" && (
          <PlantEnergyDashboard
            zoneHistory={zoneEnergyHistory}
            energyHistory={historyEntries}
            config={config}
          />
        )}

        {tab === "history" && <HistoryTab historyEntries={historyEntries} zoneEnergyHistory={zoneEnergyHistory} />}
      </div>

      {toast && <Toast message={toast} onDone={() => setToast(null)} />}
    </div>
  );
}

// ===========================================================================
// Small floating toolbar for moving data between phones, since each phone
// keeps its own separate localStorage copy (see storage polyfill above).
// ===========================================================================
function DataToolsBar() {
  const [msg, setMsg] = useState(null);
  const fileInputRef = React.useRef(null);

  const handleExport = () => {
    window.__pjwExportData();
    setMsg("ส่งออกไฟล์สำรองข้อมูลแล้ว");
    setTimeout(() => setMsg(null), 2500);
  };

  const handleImportClick = () => fileInputRef.current && fileInputRef.current.click();

  const handleFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    window.__pjwImportData(file, (ok, count) => {
      setMsg(ok ? `นำเข้าข้อมูล ${count} รายการแล้ว — กำลังโหลดใหม่...` : "ไฟล์ไม่ถูกต้อง นำเข้าไม่สำเร็จ");
      if (ok) setTimeout(() => window.location.reload(), 900);
      else setTimeout(() => setMsg(null), 2500);
    });
    e.target.value = "";
  };

  return (
    <div style={{ position: "fixed", top: 8, right: 8, zIndex: 60, display: "flex", gap: 6, alignItems: "center" }}>
      {msg && (
        <span style={{ background: "#16232E", color: "#fff", fontSize: 11, padding: "4px 8px", borderRadius: 6 }}>
          {msg}
        </span>
      )}
      <button
        onClick={handleExport}
        title="ส่งออกข้อมูลของเครื่องนี้เป็นไฟล์ (สำหรับสำรอง/ย้ายไปเครื่องอื่น)"
        style={{ background: "#FFFFFF", border: "1px solid #DCE2E8", borderRadius: 6, padding: "5px 8px", fontSize: 11, color: "#0F2942", boxShadow: "0 1px 2px rgba(0,0,0,0.1)" }}
      >
        ⬇︎ ส่งออก
      </button>
      <button
        onClick={handleImportClick}
        title="นำเข้าข้อมูลจากไฟล์สำรองที่ส่งออกไว้ก่อนหน้า"
        style={{ background: "#FFFFFF", border: "1px solid #DCE2E8", borderRadius: 6, padding: "5px 8px", fontSize: 11, color: "#0F2942", boxShadow: "0 1px 2px rgba(0,0,0,0.1)" }}
      >
        ⬆︎ นำเข้า
      </button>
      <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={handleFileChange} />
    </div>
  );
}

function AppWithDataTools() {
  return (
    <>
      <DataToolsBar />
      <UtilityHealthApp />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AppWithDataTools />);

</script>
</body>
