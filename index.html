// ===========================================================================
// Storage polyfill — this file was originally built as a Claude "Artifact",
// which provides a shared window.storage.get/set/list API automatically.
// Opened as a plain HTML file on a phone, that API does not exist, so this
// polyfill backs it with the browser's localStorage instead.
//
// IMPORTANT LIMITATION: localStorage is PER DEVICE / PER BROWSER. Unlike the
// original Claude Artifact version (where "shared: true" meant every
// teammate saw the same data), each phone that opens this HTML file keeps
// its own separate copy of the data. Nothing is synced between phones
// automatically. Use the "Export / Import ข้อมูล" buttons in the app header
// to move data between phones (e.g. export on one phone, send the file,
// import on another) or to keep a manual backup.
// ===========================================================================
(function () {
  const PREFIX = "pjw_utility_";
  window.storage = {
    async get(key) {
      const v = window.localStorage.getItem(PREFIX + key);
      return v === null ? null : { key, value: v };
    },
    async set(key, value) {
      window.localStorage.setItem(PREFIX + key, value);
      return { key, value };
    },
    async delete(key) {
      window.localStorage.removeItem(PREFIX + key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const p = PREFIX + (prefix || "");
      const keys = [];
      for (let i = 0; i < window.localStorage.length; i++) {
        const k = window.localStorage.key(i);
        if (k && k.indexOf(p) === 0) keys.push(k.slice(PREFIX.length));
      }
      return { keys };
    },
  };

  // Export every saved key as a single downloadable JSON file.
  window.__pjwExportData = function () {
    const dump = {};
    for (let i = 0; i < window.localStorage.length; i++) {
      const k = window.localStorage.key(i);
      if (k && k.indexOf(PREFIX) === 0) {
        dump[k.slice(PREFIX.length)] = window.localStorage.getItem(k);
      }
    }
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `pjw-utility-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // Import a previously exported JSON file, merging it into this phone's
  // localStorage (existing keys with the same name are overwritten).
  window.__pjwImportData = function (file, onDone) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        Object.keys(data).forEach((k) => {
          window.localStorage.setItem(PREFIX + k, data[k]);
        });
        onDone(true, Object.keys(data).length);
      } catch (e) {
        onDone(false, 0);
      }
    };
    reader.readAsText(file);
  };
})();

// ===========================================================================
// Icon shim — renders the same Lucide icon set the app was built with,
// using the vanilla `lucide` package (loaded above) instead of the
// React-specific `lucide-react` package, since only the vanilla build has a
// simple CDN/UMD distribution. Each icon keeps the same name and the same
// {size, color, className} usage the rest of the app already relies on.
// ===========================================================================
function LucideIcon({ name, size = 16, color = "currentColor", className = "", style }) {
  const data = window.lucide && window.lucide.icons ? window.lucide.icons[name] : null;
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current || !data) return;
    ref.current.innerHTML = "";
    const svg = window.lucide.createElement(data);
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);
    svg.setAttribute("stroke", color);
    ref.current.appendChild(svg);
  }, [name, size, color]);
  if (!data) return null;
  return React.createElement("span", {
    ref,
    className,
    style: { display: "inline-flex", lineHeight: 0, ...style },
  });
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function fmtShort(dateStr) {
  const [, m, d] = dateStr.split("-");
  return `${d}/${m}`;
}
function monthKey(dateStr) {
  return dateStr.slice(0, 7); // YYYY-MM
}
const MONTH_NAMES_TH = [
  "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
  "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม",
];
function daysInMonth(year, month) {
  return new Date(year, month, 0).getDate(); // month is 1-indexed here
}
function pad2(n) {
  return String(n).padStart(2, "0");
}
function ymd(year, month, day) {
  return `${year}-${pad2(month)}-${pad2(day)}`;
}
function isFutureDate(dateStr) {
  return dateStr > todayStr();
}
function num(v) {
  const n = parseFloat(v);
  return Number.isFinite(n) ? n : 0;
}

// ---------------------------------------------------------------------------
// Zone energy helpers — total kWh & per-system totals are always DERIVED
// from the per-zone sub-meter entries, never entered as a separate number,
// so there is exactly one place the truth lives.
// ---------------------------------------------------------------------------
function zoneTotalKwh(zoneData) {
  if (!zoneData?.systems) return 0;
  return SYSTEM_TYPES.reduce((sum, s) => sum + num(zoneData.systems[s.key]), 0);
}
function plantTotalKwh(zoneEnergyRecord) {
  if (!zoneEnergyRecord) return 0;
  return ZONES.reduce((sum, z) => sum + zoneTotalKwh(zoneEnergyRecord[z.key]), 0);
}
function systemTypeTotal(zoneEnergyRecord, systemKey) {
  if (!zoneEnergyRecord) return 0;
  return ZONES.reduce((sum, z) => sum + num(zoneEnergyRecord[z.key]?.systems?.[systemKey]), 0);
}
function zoneHasData(zoneData) {
  return !!zoneData && (zoneTotalKwh(zoneData) > 0 || num(zoneData.pf) > 0);
}

// ---------------------------------------------------------------------------
// Health scoring ("doctor app" style diagnosis)
// ---------------------------------------------------------------------------
function computeUnitStatus(category, unitCode, entry) {
  if (!category.checklistKey) {
    const s = entry.simpleStatus?.[unitCode];
    return s === "ok" || s === "fail" ? s : "unchecked";
  }
  const template = CHECKLIST_TEMPLATES[category.checklistKey];
  const itemResults = entry.results?.[unitCode] || {};
  const answered = template.filter((t) => itemResults[t.id] === "ok" || itemResults[t.id] === "fail");
  if (answered.length === 0) {
    // No itemized answers yet for this day — fall back to a quick tick (e.g. entered
    // straight from the monthly grid) so a fast daily mark still counts toward health.
    const quick = entry.simpleStatus?.[unitCode];
    return quick === "ok" || quick === "fail" ? quick : "unchecked";
  }
  if (answered.some((t) => itemResults[t.id] === "fail")) return "fail";
  if (answered.length < template.length) return "partial";
  return "ok";
}

function scoreItems(category, items, entry) {
  let ok = 0, checked = 0;
  const total = items.filter((i) => !i.spare).length;
  items.forEach((it) => {
    if (it.spare) return;
    const s = computeUnitStatus(category, it.code, entry);
    if (s === "ok" || s === "fail") {
      checked += 1;
      if (s === "ok") ok += 1;
    }
  });
  return { ok, checked, total };
}

function scoreCategory(category, entry) {
  return scoreItems(category, category.items, entry);
}

function overallScore(entry) {
  if (!entry) return null;
  let ok = 0, checked = 0;
  CATEGORIES.forEach((cat) => {
    const s = scoreCategory(cat, entry);
    ok += s.ok;
    checked += s.checked;
  });
  if (checked === 0) return null;
  return Math.round((ok / checked) * 100);
}

function zoneScore(zoneKey, entry) {
  let ok = 0, checked = 0, total = 0;
  CATEGORIES.forEach((cat) => {
    const zoneItems = cat.items.filter((i) => i.zone === zoneKey);
    const s = scoreItems(cat, zoneItems, entry);
    ok += s.ok; checked += s.checked; total += s.total;
  });
  return { ok, checked, total, pct: checked === 0 ? null : Math.round((ok / checked) * 100) };
}

function healthLabel(score) {
  if (score === null || score === undefined) return { text: "ยังไม่มีข้อมูล", color: MUTED };
  if (score >= 95) return { text: "ดีเยี่ยม", color: GREEN };
  if (score >= 85) return { text: "ปกติ", color: "#2C6FB0" };
  if (score >= 70) return { text: "ต้องเฝ้าระวัง", color: AMBER };
  return { text: "วิกฤต ต้องแก้ไขด่วน", color: RED };
}

function pfLabel(pf) {
  if (pf === null || pf === undefined || pf === "") return { text: "ยังไม่มีข้อมูล", color: MUTED };
  const v = parseFloat(pf);
  if (Number.isNaN(v)) return { text: "-", color: MUTED };
  if (v >= 0.9) return { text: "ปกติ (≥ 0.90)", color: GREEN };
  if (v >= 0.85) return { text: "เฝ้าระวัง (0.85–0.90)", color: AMBER };
  return { text: "ต่ำกว่ามาตรฐาน (< 0.85)", color: RED };
}

const STATUS_META = {
  unchecked: { text: "ยังไม่ตรวจ", color: MUTED, bg: "#F1F3F5" },
  partial: { text: "กำลังตรวจ", color: AMBER, bg: `${AMBER}1A` },
  ok: { text: "ปกติ", color: GREEN, bg: `${GREEN}1A` },
  fail: { text: "ผิดปกติ", color: RED, bg: `${RED}1A` },
};

async function safeGet(key) {
  try {
    const res = await window.storage.get(key, true);
    return res ? JSON.parse(res.value) : null;
  } catch {
    return null;
  }
}
async function safeSet(key, data) {
  await window.storage.set(key, JSON.stringify(data), true);
}
async function listRecentDates(prefix, limit = 30) {
  try {
    const res = await window.storage.list(prefix, true);
    const dates = (res?.keys || [])
      .map((k) => k.slice(prefix.length))
      .sort()
      .reverse()
      .slice(0, limit)
      .reverse();
    return dates;
  } catch {
    return [];
  }
}

const DEFAULT_ENERGY_CONFIG = {
  tariffThbPerKwh: "3.50", // matches the project's stated default; editable in ตั้งค่า
  pfTarget: "0.85", // standard PF penalty threshold used by Thai utilities (MEA/PEA); editable
  pfPenaltyRatePerKvar: "", // N/A until the user enters their own rate from their utility invoice
  carbonFactorKgPerKwh: "", // N/A until the user enters their grid's published emission factor

// ---------------------------------------------------------------------------
// Advanced energy-engineering formulas — every constant here is either a
// textbook definition (Load Factor, reactive-power triangle) or a value the
// user configures themselves (tariff, PF penalty rate, emission factor).
// Nothing is a guessed/fabricated engineering number.
// ---------------------------------------------------------------------------

// Load Factor (%) = Average Load ÷ Peak Demand, for a 24h day:
// Average Load (kW) = kWh ÷ 24h. Standard electrical-engineering definition.
function loadFactorPct(kwh, peakKw) {
  const k = num(kwh), p = num(peakKw);
  if (p <= 0) return null;
  const avgLoad = k / 24;
  return Math.min(100, (avgLoad / p) * 100);
}

// Reactive power (kVAR) that would need to be corrected to reach the target
// PF, from the standard power triangle: kVAR = kW × (tanφ_actual − tanφ_target).
// This is pure trigonometry — no fabricated constant.
function excessKvar(peakKw, pfActual, pfTarget) {
  const p = num(peakKw);
  const pfA = parseFloat(pfActual);
  const pfT = parseFloat(pfTarget);
  if (!p || !pfA || !pfT || pfA <= 0 || pfA >= 1 || pfT <= 0 || pfT >= 1) return null;
  const phiA = Math.acos(pfA);
  const phiT = Math.acos(pfT);
  const kvar = p * (Math.tan(phiA) - Math.tan(phiT));
  return kvar > 0 ? kvar : 0;
}

function pfPenaltyEstimate(peakKw, pfActual, config) {
  const kvar = excessKvar(peakKw, pfActual, config.pfTarget);
  if (kvar === null) return null;
  const rate = parseFloat(config.pfPenaltyRatePerKvar);
  if (!rate) return { kvar, cost: null };
  return { kvar, cost: kvar * rate };
}

function co2eKg(kwh, config) {
  const factor = parseFloat(config.carbonFactorKgPerKwh);
  if (!factor) return null;
  return num(kwh) * factor;
}

function ScoreRing({ score, size = 132, labelText = "สุขภาพระบบ" }) {
  const lbl = healthLabel(score);
  const r = (size - 14) / 2;
  const c = 2 * Math.PI * r;
  const offset = score === null ? c : c - (score / 100) * c;
  return (
    <div className="relative" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size / 2} cy={size / 2} r={r} stroke="#2A4A66" strokeWidth="10" fill="none" />
        <circle
          cx={size / 2} cy={size / 2} r={r} stroke={lbl.color} strokeWidth="10" fill="none"
          strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
          style={{ transition: "stroke-dashoffset 0.6s ease" }}
        />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <span className="text-2xl font-semibold text-white leading-none">
          {score === null ? "–" : `${score}%`}
        </span>
        <span className="text-[10px] mt-1 text-center px-2" style={{ color: "#9FB4C7" }}>{labelText}</span>
      </div>
    </div>
  );
}

function Toast({ message, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 2400);
    return () => clearTimeout(t);
  }, [onDone]);
  return (
    <div className="fixed bottom-6 right-6 bg-[#16232E] text-white text-sm px-4 py-2.5 rounded shadow-lg z-50 flex items-center gap-2 max-w-sm">
      <CheckCircle2 size={16} color={GREEN} className="flex-shrink-0" />
      {message}
    </div>
  );
}

function UnitChecklistRow({ category, unit, entry, setResult, setSimpleStatus, setNote, setValue }) {
  const [open, setOpen] = useState(false);
  const status = computeUnitStatus(category, unit.code, entry);
  const meta = STATUS_META[status];
  const template = category.checklistKey ? CHECKLIST_TEMPLATES[category.checklistKey] : null;

  if (unit.spare) {
    return (
      <div className="flex items-center justify-between px-4 py-2.5 border-b last:border-b-0" style={{ borderColor: "#F0F2F5" }}>
        <div>
          <p className="text-sm font-medium" style={{ color: "#16232E" }}>{unit.code}</p>
          <p className="text-xs" style={{ color: MUTED }}>โซน {unit.zone}{unit.note ? ` · ${unit.note}` : ""}</p>
        </div>
        <span className="text-xs italic" style={{ color: MUTED }}>เครื่องสำรอง — ไม่รวมในคะแนนสุขภาพ</span>
      </div>
    );
  }

  if (!template) {
    // Simple mode (e.g. Transformer, Air Dryer, Hoist/Rigging): single ok/fail
    // toggle, no sub-checklist.
    const simple = entry.simpleStatus?.[unit.code];
    return (
      <div className="flex items-center gap-3 px-4 py-2.5 border-b last:border-b-0 flex-wrap" style={{ borderColor: "#F0F2F5" }}>
        <div className="w-36 flex-shrink-0">

          <p className="text-xs" style={{ color: MUTED }}>โซน {unit.zone}{unit.note ? ` · ${unit.note}` : ""}</p>
        </div>
        <button
          onClick={() => setSimpleStatus(unit.code, "ok")}
          className="flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-medium border"
          style={simple === "ok" ? { backgroundColor: `${GREEN}1A`, color: GREEN, borderColor: GREEN } : { backgroundColor: "#FFF", color: MUTED, borderColor: BORDER }}
        >
          <CheckCircle2 size={14} /> ปกติ
        </button>
        <button
          onClick={() => setSimpleStatus(unit.code, "fail")}
          className="flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-medium border"
          style={simple === "fail" ? { backgroundColor: `${RED}1A`, color: RED, borderColor: RED } : { backgroundColor: "#FFF", color: MUTED, borderColor: BORDER }}
        >
          <XCircle size={14} /> ผิดปกติ

        <input
          type="text"
          placeholder="หมายเหตุ / ค่าที่วัดได้ (ถ้ามี)"

          style={{ borderColor: BORDER }}
        />
      </div>
    );
  }

  const itemResults = entry.results?.[unit.code] || {};
  const itemValues = entry.notes?.[unit.code] || {};
  const answeredCount = template.filter((t) => itemResults[t.id] === "ok" || itemResults[t.id] === "fail").length;

  return (
    <div className="border-b last:border-b-0" style={{ borderColor: "#F0F2F5" }}>

        {open ? <ChevronDown size={15} color={MUTED} /> : <ChevronRight size={15} color={MUTED} />}

          {meta.text} ({answeredCount}/{template.length})

      {open && (
        <div className="pb-3 pl-9 pr-4">

}

// ---------------------------------------------------------------------------
// Monthly grid — full-month calendar table per category, click a cell to
// cycle its status (like the paper "แผน/จริง" matrix, but live and shared).
// ---------------------------------------------------------------------------
const STATUS_CYCLE = ["unchecked", "ok", "fail"];
const GRID_DOT = {
  unchecked: { bg: "#E7EAEE", ring: "#D5DAE0" },
  partial: { bg: AMBER, ring: AMBER },
  ok: { bg: GREEN, ring: GREEN },
  fail: { bg: RED, ring: RED },
};

function MonthlyGridTab({ year, month, setYearMonth, category, setCategoryKey, monthEntries, loading, onToggleCell, savingCell }) {
  const nDays = daysInMonth(year, month);
  const days = Array.from({ length: nDays }, (_, i) => i + 1);
  const units = category.items;

  const goMonth = (delta) => {
    let m = month + delta, y = year;
    if (m > 12) { m = 1; y += 1; }
    if (m < 1) { m = 12; y -= 1; }
    setYearMonth(y, m);
  };

  const monthlyStat = (unit) => {
    let ok = 0, fail = 0, checked = 0;
    days.forEach((d) => {
      const dateStr = ymd(year, month, d);
      const e = monthEntries[dateStr];
      if (!e) return;
      const s = computeUnitStatus(category, unit.code, e);
      if (s === "ok") { ok += 1; checked += 1; }
      if (s === "fail") { fail += 1; checked += 1; }
    });
    return { ok, fail, checked };
  };

  return (
    <div className="space-y-5">
      <Card className="flex items-center gap-3 flex-wrap justify-between">
        <div className="flex items-center gap-2">
          <button onClick={() => goMonth(-1)} className="p-1.5 rounded hover:bg-gray-100" style={{ color: MUTED }}>
            <ChevronLeft size={18} />
          </button>
          <div className="flex items-center gap-2 text-sm font-semibold min-w-[150px] justify-center" style={{ color: "#16232E" }}>
            <CalendarDays size={16} color={MUTED} />
            {MONTH_NAMES_TH[month - 1]} {year + 543}
          </div>
          <button onClick={() => goMonth(1)} className="p-1.5 rounded hover:bg-gray-100" style={{ color: MUTED }}>
            <ChevronRight size={18} />
          </button>
        </div>
        <div className="flex items-center gap-1.5 overflow-x-auto max-w-full">
          {CATEGORIES.map((c) => {
            const Icon = ICONS[c.iconKey];
            const active = c.key === category.key;
            return (
              <button
                key={c.key}
                onClick={() => setCategoryKey(c.key)}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap border transition-colors"
                style={active
                  ? { backgroundColor: `${c.color}1A`, color: c.color, borderColor: c.color }
                  : { backgroundColor: "#FFF", color: MUTED, borderColor: BORDER }}
              >
                <Icon size={13} /> {c.label}
              </button>
            );
          })}
        </div>
      </Card>

      <Card padded={false} className="overflow-x-auto">
        {loading ? (
          <EmptyState icon={CalendarDays} text="กำลังโหลดข้อมูลทั้งเดือน..." />
        ) : (
          <table className="text-sm border-collapse w-full">
            <thead>
              <tr>
                <th className="sticky left-0 z-10 bg-white text-left px-3 py-2.5 text-xs font-semibold border-b border-r" style={{ color: "#16232E", borderColor: BORDER, minWidth: 150 }}>
                  {category.label}
                </th>
                {days.map((d) => {
                  const dateStr = ymd(year, month, d);
                  const isToday = dateStr === todayStr();
                  return (
                    <th
                      key={d}
                      className="text-center px-1 py-2 text-[10px] font-medium border-b"
                      style={{ color: isToday ? NAVY : MUTED, borderColor: BORDER, backgroundColor: isToday ? `${AMBER}22` : "transparent", minWidth: 26 }}
                    >
                      {d}
                    </th>
                  );
                })}
                <th className="text-center px-2 py-2 text-[10px] font-semibold border-b border-l" style={{ color: "#16232E", borderColor: BORDER, minWidth: 70 }}>
                  สรุปเดือน
                </th>
              </tr>
            </thead>
            <tbody>
              {units.map((unit) => {
                const stat = monthlyStat(unit);
                return (
                  <tr key={unit.code}>
                    <td className="sticky left-0 z-10 bg-white px-3 py-2 border-b border-r" style={{ borderColor: BORDER }}>
                      <p className="text-xs font-medium" style={{ color: "#16232E" }}>{unit.code}</p>
                      <p className="text-[10px]" style={{ color: MUTED }}>โซน {unit.zone}{unit.spare ? " · สำรอง" : ""}</p>
                    </td>
                    {days.map((d) => {
                      const dateStr = ymd(year, month, d);
                      const e = monthEntries[dateStr];
                      const status = unit.spare ? "unchecked" : (e ? computeUnitStatus(category, unit.code, e) : "unchecked");
                      const dot = GRID_DOT[status] || GRID_DOT.unchecked;
                      const future = isFutureDate(dateStr);
                      const cellKey = `${dateStr}__${unit.code}`;
                      const isSaving = savingCell === cellKey;
                      return (
                        <td key={d} className="text-center border-b" style={{ borderColor: "#F0F2F5" }}>
                          <button
                            disabled={unit.spare || future}
                            onClick={() => onToggleCell(dateStr, category, unit.code)}
                            className="w-6 h-6 rounded-md flex items-center justify-center mx-auto my-0.5 disabled:opacity-30 disabled:cursor-not-allowed transition-transform hover:scale-110"
                            title={`${unit.code} · ${dateStr}`}
                          >
                            {isSaving ? (
                              <span className="w-2.5 h-2.5 rounded-full animate-pulse" style={{ backgroundColor: MUTED }} />
                            ) : status === "ok" ? (
                              <CheckCircle2 size={16} color={GREEN} />
                            ) : status === "fail" ? (
                              <XCircle size={16} color={RED} />
                            ) : status === "partial" ? (
                              <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: dot.bg }} />
                            ) : (
                              <Minus size={13} color="#C7CDD4" />
                            )}
                          </button>
                        </td>
                      );
                    })}
                    <td className="text-center px-2 py-2 border-b border-l" style={{ borderColor: BORDER }}>
                      {unit.spare ? (
                        <span className="text-[10px]" style={{ color: MUTED }}>สำรอง</span>
                      ) : (
                        <span className="text-[10px]" style={{ color: MUTED }}>
                          <span style={{ color: GREEN, fontWeight: 600 }}>{stat.ok}</span>
                          {" / "}
                          <span style={{ color: RED, fontWeight: 600 }}>{stat.fail}</span>
                          {" / "}{nDays}
                        </span>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </Card>

      <Card>
        <p className="text-xs font-semibold mb-2" style={{ color: "#16232E" }}>วิธีใช้ตาราง</p>
        <div className="flex flex-wrap gap-4 text-xs" style={{ color: MUTED }}>
          <span className="flex items-center gap-1.5"><Minus size={13} color="#C7CDD4" /> ยังไม่ตรวจ</span>
          <span className="flex items-center gap-1.5"><CheckCircle2 size={14} color={GREEN} /> ปกติ</span>
          <span className="flex items-center gap-1.5"><XCircle size={14} color={RED} /> ผิดปกติ</span>
          <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full inline-block" style={{ backgroundColor: AMBER }} /> ตรวจละเอียดบางส่วน (ไปเติมต่อได้ที่แท็บ &quot;บันทึกผลตรวจ&quot;)</span>
        </div>
        <p className="text-xs mt-2" style={{ color: MUTED }}>
          คลิกที่จุดในตาราง เพื่อสลับสถานะ ยังไม่ตรวจ → ปกติ → ผิดปกติ → ยังไม่ตรวจ ได้ทันที (บันทึกอัตโนมัติทุกครั้งที่คลิก)
          สรุปเดือนนับเฉพาะวันที่มีการตรวจแล้วเท่านั้น ช่อง &quot;ผิดปกติ&quot; ที่ต้องการรายละเอียดครบ ให้ไปกรอกที่แท็บ &quot;บันทึกผลตรวจ&quot; ของวันนั้น
        </p>
      </Card>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Plant Energy Dashboard — trend per plant + cross-plant comparison,
// built from the zoneenergy history already being saved by ZoneEnergyTab.
// ---------------------------------------------------------------------------
function PlantEnergyDashboard({ zoneHistory, energyHistory, config }) {
  const [view, setView] = useState("trend"); // trend | compare | quality | carbon
  const [selectedZone, setSelectedZone] = useState("A");

  const latestZone = [...zoneHistory].reverse().find((r) => r.data && Object.keys(r.data).length > 0);
  const latestEnergyRow = [...energyHistory].reverse().find((r) => r.energy);

  // Merge the two histories by date so every chart has both the zone
  // breakdown and the plant-wide meter reading for that day.
  const mergedDates = Array.from(new Set([...zoneHistory.map((r) => r.date), ...energyHistory.map((r) => r.date)])).sort();
  const merged = mergedDates.map((date) => {
    const z = zoneHistory.find((r) => r.date === date)?.data;
    const e = energyHistory.find((r) => r.date === date)?.energy;
    const totalKwh = z ? plantTotalKwh(z) : null;
    const production = e?.production ? num(e.production) : null;
    return {
      date,
      totalKwh,
      sec: totalKwh && production ? totalKwh / production : null,
      cost: totalKwh ? totalKwh * num(config.tariffThbPerKwh) : null,
      peak: e?.peak ? num(e.peak) : null,
      mainPf: e?.mainPf ? num(e.mainPf) : null,
      loadFactor: e?.peak && totalKwh ? loadFactorPct(totalKwh, e.peak) : null,
    };
  });
  const validKwhPoints = merged.filter((m) => m.totalKwh !== null);

  // --- Baseline / EnPI / CUSUM (ISO 50001 & IPMVP-style measurement & verification) ---
  const baselineN = Math.max(1, parseInt(config.baselineDays, 10) || 30);
  const baselineSet = validKwhPoints.slice(0, baselineN);
  const baselineAvg = baselineSet.length >= 3 ? baselineSet.reduce((s, d) => s + d.totalKwh, 0) / baselineSet.length : null;
  let cusum = 0;
  const cusumSeries = validKwhPoints.map((d) => {
    cusum += baselineAvg !== null ? baselineAvg - d.totalKwh : 0;
    return { date: fmtShort(d.date), cusum: baselineAvg !== null ? Math.round(cusum) : null, kwh: d.totalKwh };
  });
  const latestKwh = validKwhPoints[validKwhPoints.length - 1]?.totalKwh ?? null;
  const enpiPct = baselineAvg && latestKwh !== null ? (latestKwh / baselineAvg) * 100 : null;
  const targetPct = num(config.targetReductionPct);
  const targetProgress = baselineAvg && latestKwh !== null && targetPct > 0
    ? Math.min(100, Math.max(0, (((baselineAvg - latestKwh) / baselineAvg) / (targetPct / 100)) * 100))
    : null;

  // --- Cross-zone comparison (stacked by system type) ---
  const stackedByZone = ZONES.map((z) => {
    const ze = latestZone?.data?.[z.key];
    const row = { zone: z.label.replace("Plant.", "") };
    SYSTEM_TYPES.forEach((s) => { row[s.key] = ze ? num(ze.systems?.[s.key]) : 0; });
    return row;
  });

  // --- System-type share (donut) across the whole plant, latest date ---
  const systemShare = SYSTEM_TYPES.map((s) => ({
    name: s.label,
    value: latestZone ? systemTypeTotal(latestZone.data, s.key) : 0,
    color: s.color,
  })).filter((s) => s.value > 0);
  const systemShareTotal = systemShare.reduce((s, x) => s + x.value, 0);

  // --- Per-zone trend (for the zone picker under "compare") ---
  const trendForZone = zoneHistory.map((r) => ({
    date: fmtShort(r.date),
    kwh: r.data?.[selectedZone] ? zoneTotalKwh(r.data[selectedZone]) : null,
    pf: r.data?.[selectedZone]?.pf ? parseFloat(r.data[selectedZone].pf) : null,
  }));

  // --- Power quality across zones (latest date) ---
  const pfRows = ZONES.map((z) => {
    const ze = latestZone?.data?.[z.key];
    return { zone: z.label, pf: ze?.pf ? parseFloat(ze.pf) : null, color: z.color };
  });
  const mainPenalty = latestEnergyRow ? pfPenaltyEstimate(latestEnergyRow.energy.peak, latestEnergyRow.energy.mainPf, config) : null;

  // --- Data-driven insights (computed facts only, no invented causes) ---
  const insights = [];
  if (latestZone) {
    const zoneTotals = ZONES.map((z) => ({ z, total: zoneTotalKwh(latestZone.data[z.key]) })).sort((a, b) => b.total - a.total);
    if (zoneTotals[0]?.total > 0) {
      const pct = systemShareTotal > 0 ? Math.round((zoneTotals[0].total / plantTotalKwh(latestZone.data)) * 100) : 0;
      insights.push(`${zoneTotals[0].z.label} ใช้พลังงานสูงสุดในวันที่มีข้อมูลล่าสุด (${pct}% ของทั้งหมด)`);
    }
    const sysTotals = SYSTEM_TYPES.map((s) => ({ s, total: systemTypeTotal(latestZone.data, s.key) })).sort((a, b) => b.total - a.total);
    if (sysTotals[0]?.total > 0) {
      const pct = systemShareTotal > 0 ? Math.round((sysTotals[0].total / systemShareTotal) * 100) : 0;
      insights.push(`ระบบ ${sysTotals[0].s.label} เป็นสัดส่วนการใช้พลังงานสูงสุด (${pct}% ของทั้งหมด)`);
    }
    const lowPf = pfRows.filter((r) => r.pf !== null && r.pf < num(config.pfTarget));
    if (lowPf.length > 0) insights.push(`PF ต่ำกว่าเป้าหมาย (${config.pfTarget}) ใน ${lowPf.map((r) => r.zone).join(", ")}`);
  }
  if (validKwhPoints.length >= 2) {
    const diff = validKwhPoints[validKwhPoints.length - 1].totalKwh - validKwhPoints[validKwhPoints.length - 2].totalKwh;
    const pct = validKwhPoints[validKwhPoints.length - 2].totalKwh > 0 ? Math.round((diff / validKwhPoints[validKwhPoints.length - 2].totalKwh) * 100) : 0;
    insights.push(`พลังงานรวมเปลี่ยนแปลง ${diff >= 0 ? "เพิ่มขึ้น" : "ลดลง"} ${Math.abs(pct)}% เทียบกับการบันทึกครั้งก่อนหน้า`);
  }

  const views = [
    { key: "trend", label: "แนวโน้ม & SEC", icon: TrendingUp },
    { key: "compare", label: "เปรียบเทียบโรงงาน", icon: BarChart3 },
    { key: "quality", label: "คุณภาพไฟฟ้า", icon: Activity },
    { key: "carbon", label: "คาร์บอน & ต้นทุน", icon: Leaf },
  ];

  return (
    <div className="space-y-5">
      <Card padded={false} className="flex gap-1 overflow-x-auto px-2 py-2">
        {views.map((v) => {
          const Icon = v.icon;
          const active = view === v.key;
          return (
            <button
              key={v.key}
              onClick={() => setView(v.key)}
              className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-medium whitespace-nowrap"
              style={active ? { backgroundColor: `${NAVY}0F`, color: NAVY } : { color: MUTED }}
            >
              <Icon size={14} /> {v.label}
            </button>
          );
        })}
      </Card>

      {insights.length > 0 && (
        <Card>
          <p className="text-xs font-semibold mb-2 flex items-center gap-1.5" style={{ color: "#16232E" }}>
            <Target size={13} color={NAVY} /> ข้อสังเกตจากข้อมูลล่าสุด (คำนวณอัตโนมัติ ไม่ใช่การคาดเดา)
          </p>
          <ul className="space-y-1">
            {insights.map((t, i) => (
              <li key={i} className="text-xs flex items-start gap-1.5" style={{ color: MUTED }}>
                <span className="mt-1.5 w-1 h-1 rounded-full flex-shrink-0" style={{ backgroundColor: NAVY }} /> {t}
              </li>
            ))}
          </ul>
        </Card>
      )}

      {view === "trend" && (
        <>
          <Card>
            <div className="flex items-center justify-between flex-wrap gap-2 mb-4">
              <p className="text-sm font-semibold flex items-center gap-2" style={{ color: "#16232E" }}>
                <TrendingUp size={16} color={NAVY} /> พลังงานรวม &amp; SEC รายวัน
              </p>
              {baselineAvg !== null && (
                <Pill color={enpiPct <= 100 ? GREEN : RED}>
                  EnPI: {enpiPct.toFixed(1)}% ของเส้นฐาน
                </Pill>
              )}
            </div>
            {validKwhPoints.length === 0 ? (
              <EmptyState icon={TrendingUp} text="ยังไม่มีข้อมูลพลังงานเพียงพอสำหรับกราฟ" />
            ) : (
              <ResponsiveContainer width="100%" height={250}>
                <ComposedChart data={merged.map((m) => ({ ...m, date: fmtShort(m.date) }))} margin={{ top: 5, right: 10, bottom: 0, left: -20 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#EEF1F4" />
                  <XAxis dataKey="date" tick={{ fontSize: 11, fill: MUTED }} />
                  <YAxis yAxisId="kwh" tick={{ fontSize: 11, fill: MUTED }} />
                  <YAxis yAxisId="sec" orientation="right" tick={{ fontSize: 11, fill: MUTED }} />
                  <Tooltip />
                  <Legend wrapperStyle={{ fontSize: 12 }} />
                  <Bar yAxisId="kwh" dataKey="totalKwh" name="Total Energy (kWh)" fill={NAVY} radius={[4, 4, 0, 0]} />
                  <Line yAxisId="sec" type="monotone" dataKey="sec" name="SEC (kWh/หน่วย)" stroke={AMBER} strokeWidth={2} dot={{ r: 3 }} connectNulls />
                </ComposedChart>
              </ResponsiveContainer>
            )}
            <p className="text-[10px] mt-2" style={{ color: MUTED }}>
              SEC = พลังงานรวม ÷ จำนวนหน่วยผลิต (กรอกจำนวนหน่วยผลิตที่แท็บ &quot;บันทึกข้อมูล&quot; เพื่อให้คำนวณได้)
            </p>
          </Card>

          <Card>
            <p className="text-sm font-semibold mb-1 flex items-center gap-2" style={{ color: "#16232E" }}>
              <Target size={16} color={NAVY} /> CUSUM เทียบเส้นฐาน (Baseline/M&amp;V ตามแนวทาง ISO 50001 / IPMVP)
            </p>
            <p className="text-[11px] mb-3" style={{ color: MUTED }}>
              เส้นฐาน = ค่าเฉลี่ยพลังงาน {baselineN} วันแรกที่มีข้อมูล ({baselineAvg !== null ? `${baselineAvg.toLocaleString(undefined, { maximumFractionDigits: 0 })} kWh/วัน` : "ข้อมูลยังไม่พอ"}).
              เส้นกราฟสูงขึ้น = ใช้พลังงานน้อยกว่าเส้นฐานสะสม (ประหยัดได้จริง), เส้นกราฟต่ำลง = ใช้มากกว่าเส้นฐานสะสม
            </p>
            {baselineAvg === null ? (
              <EmptyState icon={Target} text={`ต้องมีข้อมูลอย่างน้อย 3 วันจึงจะคำนวณเส้นฐานได้ (ตั้งไว้ ${baselineN} วัน ปรับได้ที่ตั้งค่า)`} />
            ) : (
              <ResponsiveContainer width="100%" height={220}>
                <LineChart data={cusumSeries} margin={{ top: 5, right: 10, bottom: 0, left: -10 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#EEF1F4" />
                  <XAxis dataKey="date" tick={{ fontSize: 11, fill: MUTED }} />
                  <YAxis tick={{ fontSize: 11, fill: MUTED }} />
                  <Tooltip />
                  <Line type="monotone" dataKey="cusum" name="CUSUM สะสม (kWh ประหยัดได้)" stroke={GREEN} strokeWidth={2} dot={{ r: 3 }} />
                </LineChart>
              </ResponsiveContainer>
            )}
            {targetProgress !== null && (
              <div className="mt-4">
                <div className="flex items-center justify-between text-xs mb-1">
                  <span style={{ color: MUTED }}>ความคืบหน้าเป้าหมายลดพลังงาน {config.targetReductionPct}%</span>
                  <span style={{ color: NAVY, fontWeight: 600 }}>{targetProgress.toFixed(0)}%</span>
                </div>
                <div className="w-full h-2 rounded-full bg-gray-100 overflow-hidden">
                  <div className="h-full rounded-full" style={{ width: `${targetProgress}%`, backgroundColor: targetProgress >= 100 ? GREEN : AMBER }} />
                </div>
              </div>
            )}
          </Card>
        </>
      )}

      {view === "compare" && (
        <>
          <Card>
            <p className="text-sm font-semibold mb-4 flex items-center gap-2" style={{ color: "#16232E" }}>
              <BarChart3 size={16} color={NAVY} /> พลังงานแยกระบบ รายโรงงาน{latestZone ? ` (ล่าสุด ${latestZone.date})` : ""}
            </p>
            {!latestZone ? (
              <EmptyState icon={Zap} text="ยังไม่มีข้อมูล — กรอกได้ที่แท็บ 'พลังงาน' โหมดบันทึกข้อมูล" />
            ) : (
              <ResponsiveContainer width="100%" height={260}>
                <BarChart data={stackedByZone} margin={{ top: 5, right: 10, bottom: 0, left: -20 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#EEF1F4" />
                  <XAxis dataKey="zone" tick={{ fontSize: 12, fill: MUTED }} />
                  <YAxis tick={{ fontSize: 11, fill: MUTED }} />
                  <Tooltip />
                  <Legend wrapperStyle={{ fontSize: 11 }} />
                  {SYSTEM_TYPES.map((s) => (
                    <Bar key={s.key} dataKey={s.key} name={s.label} stackId="a" fill={s.color} />
                  ))}
                </BarChart>
              </ResponsiveContainer>
            )}
          </Card>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <Card>
              <p className="text-sm font-semibold mb-4 flex items-center gap-2" style={{ color: "#16232E" }}>
                <PieChartIcon size={16} color={NAVY} /> สัดส่วนการใช้พลังงานตามระบบ
              </p>
              {systemShare.length === 0 ? (
                <EmptyState icon={PieChartIcon} text="ยังไม่มีข้อมูล" />
              ) : (
                <ResponsiveContainer width="100%" height={220}>
                  <PieChart>
                    <Pie data={systemShare} dataKey="value" nameKey="name" innerRadius={55} outerRadius={85} paddingAngle={2}>
                      {systemShare.map((s, i) => <Cell key={i} fill={s.color} />)}
                    </Pie>
                    <Tooltip />
                    <Legend wrapperStyle={{ fontSize: 11 }} />
                  </PieChart>
                </ResponsiveContainer>
              )}
            </Card>

            <Card>
              <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
                <p className="text-sm font-semibold flex items-center gap-2" style={{ color: "#16232E" }}>
                  <TrendingUp size={16} color={NAVY} /> แนวโน้มรายโรงงาน
                </p>
                <div className="flex gap-1">
                  {ZONES.map((z) => (
                    <button
                      key={z.key} onClick={() => setSelectedZone(z.key)}
                      className="px-2.5 py-1 rounded-md text-[11px] font-medium border"
                      style={selectedZone === z.key
                        ? { backgroundColor: `${z.color}1A`, color: z.color, borderColor: z.color }
                        : { backgroundColor: "#FFF", color: MUTED, borderColor: BORDER }}
                    >
                      {z.key}
                    </button>
                  ))}
                </div>
              </div>
              {trendForZone.every((d) => d.kwh === null) ? (
                <EmptyState icon={TrendingUp} text="ยังไม่มีข้อมูลของโรงงานนี้" />
              ) : (
                <ResponsiveContainer width="100%" height={200}>
                  <LineChart data={trendForZone} margin={{ top: 5, right: 10, bottom: 0, left: -20 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#EEF1F4" />
                    <XAxis dataKey="date" tick={{ fontSize: 10, fill: MUTED }} />
                    <YAxis tick={{ fontSize: 10, fill: MUTED }} />
                    <Tooltip />
                    <Line type="monotone" dataKey="kwh" name="kWh" stroke={NAVY} strokeWidth={2} dot={{ r: 3 }} connectNulls />
                  </LineChart>
                </ResponsiveContainer>
              )}
            </Card>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
            {ZONES.map((z) => {
              const ze = latestZone?.data?.[z.key];
              const total = zoneTotalKwh(ze);
              const pf = pfLabel(ze?.pf);
              return (
                <Card key={z.key} className="text-center">
                  <p className="text-xs font-semibold mb-1" style={{ color: z.color }}>{z.label}</p>
                  <p className="text-lg font-semibold" style={{ color: "#16232E" }}>{total || "–"}</p>
                  <p className="text-[10px]" style={{ color: MUTED }}>kWh</p>
                  <p className="text-[11px] mt-1" style={{ color: pf.color }}>{ze?.pf ? `PF ${ze.pf}` : "ไม่มีข้อมูล PF"}</p>
                </Card>
              );
            })}
          </div>
        </>
      )}

      {view === "quality" && (
        <>
          <Card>
            <p className="text-sm font-semibold mb-4 flex items-center gap-2" style={{ color: "#16232E" }}>
              <Activity size={16} color={NAVY} /> Power Factor รายโรงงาน{latestZone ? ` (ล่าสุด ${latestZone.date})` : ""} — เป้าหมาย {config.pfTarget}
            </p>
            {!latestZone ? (
              <EmptyState icon={Activity} text="ยังไม่มีข้อมูล" />
            ) : (
              <div className="space-y-2">
                {pfRows.map((r) => (
                  <div key={r.zone} className="flex items-center gap-3">
                    <span className="text-xs w-16 flex-shrink-0" style={{ color: r.color }}>{r.zone}</span>
                    <div className="flex-1 h-2 rounded-full bg-gray-100 overflow-hidden">
                      <div
                        className="h-full rounded-full"
                        style={{ width: `${r.pf ? Math.min(100, r.pf * 100) : 0}%`, backgroundColor: r.pf === null ? "#D5DAE0" : r.pf < num(config.pfTarget) ? RED : GREEN }}
                      />
                    </div>
                    <span className="text-xs w-12 text-right" style={{ color: MUTED }}>{r.pf ?? "–"}</span>
                  </div>
                ))}
              </div>
            )}
          </Card>

          <Card>
            <p className="text-sm font-semibold mb-3 flex items-center gap-2" style={{ color: "#16232E" }}>
              <AlertTriangle size={16} color={NAVY} /> ประเมินความเสี่ยงค่าปรับ PF (มิเตอร์หลัก)
            </p>
            {!latestEnergyRow ? (
              <EmptyState icon={AlertTriangle} text="ยังไม่มีข้อมูล Peak Demand / PF มิเตอร์หลัก" />
            ) : mainPenalty === null ? (
              <p className="text-xs" style={{ color: MUTED }}>กรอก Peak Demand และ PF มิเตอร์หลักให้ครบเพื่อประเมิน</p>
            ) : mainPenalty.kvar === 0 ? (
              <p className="text-xs flex items-center gap-1.5" style={{ color: GREEN }}>
                <CheckCircle2 size={14} /> PF อยู่ในเกณฑ์เป้าหมายแล้ว ไม่มีความเสี่ยงค่าปรับ
              </p>
            ) : (
              <div className="space-y-2">
                <p className="text-xs" style={{ color: "#16232E" }}>
                  Reactive power ส่วนเกินโดยประมาณ: <span className="font-semibold" style={{ color: RED }}>{mainPenalty.kvar.toFixed(1)} kVAR</span>
                  {" "}(คำนวณจาก kW × (tanφ<sub>ปัจจุบัน</sub> − tanφ<sub>เป้าหมาย</sub>))
                </p>
                {mainPenalty.cost !== null ? (
                  <p className="text-xs" style={{ color: RED }}>
                    ค่าปรับโดยประมาณ: {mainPenalty.cost.toLocaleString(undefined, { maximumFractionDigits: 0 })} บาท/รอบบิล (ตามอัตราที่ตั้งค่าไว้)
                  </p>
                ) : (
                  <p className="text-xs" style={{ color: AMBER }}>
                    ระบุ &quot;อัตราค่าปรับ PF (บาท/kVAR)&quot; ในตั้งค่า เพื่อประมาณการค่าใช้จ่ายที่อาจเกิดขึ้น
                  </p>
                )}
                <p className="text-[10px]" style={{ color: MUTED }}>
                  ตัวเลขนี้เป็นการประมาณการเชิงวิศวกรรมเพื่อการเฝ้าระวังเท่านั้น ไม่ใช่ยอดตามใบแจ้งหนี้จริง ซึ่งขึ้นกับรอบการอ่านหน่วยของการไฟฟ้า
                </p>
              </div>
            )}
          </Card>

          <Card>
            <p className="text-sm font-semibold mb-3 flex items-center gap-2" style={{ color: "#16232E" }}>
              <Gauge size={16} color={NAVY} /> Load Factor แนวโน้ม
            </p>
            {merged.filter((m) => m.loadFactor !== null).length === 0 ? (
              <EmptyState icon={Gauge} text="กรอก Peak Demand ให้ครบเพื่อคำนวณ Load Factor" />
            ) : (
              <ResponsiveContainer width="100%" height={200}>
                <LineChart data={merged.map((m) => ({ ...m, date: fmtShort(m.date) }))} margin={{ top: 5, right: 10, bottom: 0, left: -20 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#EEF1F4" />
                  <XAxis dataKey="date" tick={{ fontSize: 11, fill: MUTED }} />
                  <YAxis domain={[0, 100]} tick={{ fontSize: 11, fill: MUTED }} />
                  <Tooltip />
                  <Line type="monotone" dataKey="loadFactor" name="Load Factor (%)" stroke={NAVY} strokeWidth={2} dot={{ r: 3 }} connectNulls />
                </LineChart>
              </ResponsiveContainer>
            )}
            <p className="text-[10px] mt-2" style={{ color: MUTED }}>
              Load Factor = (พลังงานเฉลี่ย ÷ Peak Demand) × 100% — ยิ่งสูงยิ่งใช้ไฟสม่ำเสมอ ลดต้นทุน demand charge
            </p>
          </Card>
        </>
      )}

      {view === "carbon" && (
        <>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <Card className="text-center">
              <p className="text-xs" style={{ color: MUTED }}>ค่าไฟฟ้าล่าสุดโดยประมาณ</p>
              <p className="text-2xl font-semibold mt-1" style={{ color: NAVY }}>
                {latestKwh !== null ? (latestKwh * num(config.tariffThbPerKwh)).toLocaleString(undefined, { maximumFractionDigits: 0 }) : "–"}
              </p>
              <p className="text-[10px]" style={{ color: MUTED }}>บาท (@ {config.tariffThbPerKwh || "N/A"} บาท/kWh)</p>
            </Card>
            <Card className="text-center">
              <p className="text-xs" style={{ color: MUTED }}>CO2e ล่าสุดโดยประมาณ</p>
              <p className="text-2xl font-semibold mt-1" style={{ color: latestKwh !== null && co2eKg(latestKwh, config) !== null ? GREEN : MUTED }}>
                {latestKwh !== null && co2eKg(latestKwh, config) !== null ? co2eKg(latestKwh, config).toLocaleString(undefined, { maximumFractionDigits: 0 }) : "N/A"}
              </p>
              <p className="text-[10px]" style={{ color: MUTED }}>
                {config.carbonFactorKgPerKwh ? `kgCO2e (@ ${config.carbonFactorKgPerKwh} kgCO2e/kWh)` : "ระบุ Emission Factor ในตั้งค่า"}
              </p>
            </Card> 
            
            <Card className="text-center">
              <p className="text-xs" style={{ color: MUTED }}>EnPI เทียบเส้นฐาน</p>
              <p className="text-2xl font-semibold mt-1" style={{ color: enpiPct !== null ? (enpiPct <= 100 ? GREEN : RED) : MUTED }}>
                {enpiPct !== null ? `${enpiPct.toFixed(1)}%` : "N/A"}
              </p>
              <p className="text-[10px]" style={{ color: MUTED }}>100% = เท่าเส้นฐาน, ต่ำกว่า 100% = ประหยัดกว่าเส้นฐาน</p>
            </Card>
          </div>

          <Card>
            <p className="text-sm font-semibold mb-4 flex items-center gap-2" style={{ color: "#16232E" }}>
              <Leaf size={16} color={GREEN} /> แนวโน้มต้นทุนพลังงาน
            </p>
            {merged.filter((m) => m.cost !== null).length === 0 ? (
              <EmptyState icon={Leaf} text="ยังไม่มีข้อมูล" />
            ) : (
              <ResponsiveContainer width="100%" height={220}>
                <AreaChartCost data={merged.map((m) => ({ ...m, date: fmtShort(m.date) }))} />
              </ResponsiveContainer>
            )}
            <p className="text-[10px] mt-2" style={{ color: MUTED }}>
              ต้นทุน = พลังงานรวม × อัตราค่าไฟที่ตั้งค่าไว้ ({config.tariffThbPerKwh || "N/A"} บาท/kWh) — เป็นการประมาณการ ไม่รวมค่า Ft/ค่าบริการอื่นตามใบแจ้งหนี้จริง
            </p>
          </Card>
        </>
      )}
    </div>
  );
}

function AreaChartCost({ data }) {
  return (
    <ComposedChart data={data} margin={{ top: 5, right: 10, bottom: 0, left: -20 }}>
      <defs>
        <linearGradient id="costFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="5%" stopColor={GREEN} stopOpacity={0.35} />
          <stop offset="95%" stopColor={GREEN} stopOpacity={0.02} />
        </linearGradient>
      </defs>
      <CartesianGrid strokeDasharray="3 3" stroke="#EEF1F4" />
      <XAxis dataKey="date" tick={{ fontSize: 11, fill: MUTED }} />
      <YAxis tick={{ fontSize: 11, fill: MUTED }} />
      <Tooltip />
      <Area type="monotone" dataKey="cost" name="ต้นทุนพลังงาน (บาท)" stroke={GREEN} fill="url(#costFill)" strokeWidth={2} connectNulls />
    </ComposedChart>
  );
}


// ---------------------------------------------------------------------------
// Plant-wide energy tab
// ---------------------------------------------------------------------------
function EnergyConfigPanel({ config, setConfig, onSave, saving }) {
  const [open, setOpen] = useState(false);
  const fields = [
    { key: "tariffThbPerKwh", label: "ค่าไฟฟ้า (บาท/kWh)", hint: "ค่าเริ่มต้นของบริษัท 3.50 บาท/หน่วย ปรับตามใบแจ้งหนี้จริงได้" },
    { key: "pfTarget", label: "PF เป้าหมาย", hint: "เกณฑ์ทั่วไปที่การไฟฟ้าใช้พิจารณาค่าปรับ PF คือ 0.85 ปรับได้ตามสัญญาจริง" },
    { key: "pfPenaltyRatePerKvar", label: "อัตราค่าปรับ PF (บาท/kVAR)", hint: "ระบุจากใบแจ้งหนี้การไฟฟ้าของท่าน — ไม่มีค่ากลางที่ใช้ได้ทุกที่" },
    { key: "carbonFactorKgPerKwh", label: "Emission Factor (kgCO2e/kWh)", hint: "ใช้ค่าที่เผยแพร่ล่าสุดจาก EGAT/TGO — เปลี่ยนแปลงเป็นรายปี" },
    { key: "targetReductionPct", label: "เป้าหมายลดพลังงาน (%)", hint: "เทียบกับค่าเฉลี่ยเส้นฐาน (Baseline)" },
    { key: "baselineDays", label: "จำนวนวันคำนวณเส้นฐาน (Baseline)", hint: "ค่าเฉลี่ยของ N วันแรกที่มีข้อมูล ใช้เป็นเส้นฐานเปรียบเทียบ (EnPI/CUSUM)" },
  ];

  return (
    <Card padded={false}>

function StatTile({ label, value, unit, color = "#16232E", sub }) {

// ---------------------------------------------------------------------------

  const production = num(energy.production);
  const sec = production > 0 ? totalKwh / production : null;
  const lf = loadFactorPct(totalKwh, energy.peak);
  const penalty = pfPenaltyEstimate(energy.peak, energy.mainPf, config);
  const mainPfLabel = pfLabel(energy.mainPf);

  return (
    <div className="space-y-5">
      <Card className="flex items-center gap-3 flex-wrap">
        <Calendar size={16} color={MUTED} />

      <EnergyConfigPanel config={config} setConfig={setConfig} onSave={onSaveConfig} saving={saving} />

      <Card>
        <p className="text-sm font-semibold mb-4" style={{ color: "#16232E" }}>มิเตอร์หลัก &amp; กำลังการผลิต (กรอกด้วยมือ)</p>
        {loading ? (
          <EmptyState icon={Zap} text="กำลังโหลดข้อมูล..." />
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label className="text-xs" style={{ color: MUTED }}>Peak Demand (kW)</label>
              <input type="number" step="0.01" value={energy.peak} onChange={(e) => setEnergy((p) => ({ ...p, peak: e.target.value }))} placeholder="กรอกค่า" className="w-full mt-1 border rounded px-3 py-2 text-sm" style={{ borderColor: BORDER }} />
            </div>
            <div>
              <label className="text-xs" style={{ color: MUTED }}>PF มิเตอร์หลัก</label>
              <input type="number" step="0.01" value={energy.mainPf} onChange={(e) => setEnergy((p) => ({ ...p, mainPf: e.target.value }))} placeholder="กรอกค่า" className="w-full mt-1 border rounded px-3 py-2 text-sm" style={{ borderColor: BORDER }} />
            </div>
            <div>
              <label className="text-xs" style={{ color: MUTED }}>จำนวนหน่วยผลิต (สำหรับคำนวณ SEC)</label>
              <input type="number" step="1" value={energy.production} onChange={(e) => setEnergy((p) => ({ ...p, production: e.target.value }))} placeholder="กรอกค่า" className="w-full mt-1 border rounded px-3 py-2 text-sm" style={{ borderColor: BORDER }} />
            </div>
          </div>
        )}

        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-5">
          <StatTile label="Total Energy (คำนวณจากตารางด้านล่าง)" value={totalKwh.toLocaleString()} unit="kWh" color={NAVY} />
          <StatTile label="ค่าไฟฟ้าประมาณการ" value={cost ? cost.toLocaleString(undefined, { maximumFractionDigits: 0 }) : "–"} unit="บาท" color={NAVY} />
          <StatTile label="SEC" value={sec !== null ? sec.toFixed(3) : "N/A"} unit={sec !== null ? "kWh/หน่วย" : ""} sub={production <= 0 ? "กรอกจำนวนหน่วยผลิตก่อน" : undefined} />
          <StatTile label="Load Factor" value={lf !== null ? lf.toFixed(1) : "N/A"} unit={lf !== null ? "%" : ""} sub="ประสิทธิภาพการใช้ไฟเทียบ Peak" />
        </div>

        <div className="mt-3 flex items-center gap-2 text-xs" style={{ color: mainPfLabel.color }}>
          <Activity size={13} /> สถานะ PF มิเตอร์หลัก: {mainPfLabel.text}
          {penalty && penalty.kvar > 0 && (
            <span className="ml-2" style={{ color: RED }}>
              · ต้องลด reactive power ~{penalty.kvar.toFixed(1)} kVAR เพื่อถึงเป้าหมาย
              {penalty.cost !== null ? ` (≈ ${penalty.cost.toLocaleString(undefined, { maximumFractionDigits: 0 })} บาท/รอบบิล)` : " (ระบุอัตราค่าปรับในตั้งค่าเพื่อประมาณการค่าใช้จ่าย)"}
            </span>
          )}
        </div>
      </Card>

      <ZoneEnergyTab
        selectedDate={selectedDate}
        setSelectedDate={setSelectedDate}
        zoneEnergy={zoneEnergy}
        setZoneSystem={setZoneSystem}
        setZonePf={setZonePf}

        saving={saving}

        </button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// History tab
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// BESS (Battery Energy Storage System) tab — daily SOC / charge-discharge
// entry per unit, plus a trend view with round-trip efficiency and
// equivalent full-cycle counts. All formulas here are standard battery
// engineering definitions (round-trip efficiency, equivalent cycles),
// computed only from numbers the user enters — nothing fabricated.
// ---------------------------------------------------------------------------
const BESS_CATEGORY = CATEGORIES.find((c) => c.key === "bess");
const BESS_UNITS = BESS_CATEGORY ? BESS_CATEGORY.items : [];

const emptyBessUnitEntry = () => ({ socStart: "", socEnd: "", chargedKwh: "", dischargedKwh: "", avgTemp: "", note: "" });
const emptyBessEntry = () => Object.fromEntries(BESS_UNITS.map((u) => [u.code, emptyBessUnitEntry()]));

function bessUnitMetrics(unit, unitEntry) {
  const charged = num(unitEntry?.chargedKwh);
  const discharged = num(unitEntry?.dischargedKwh);
  const efficiency = charged > 0 ? (discharged / charged) * 100 : null;
  const equivalentCycles = unit.capacityKwh > 0 ? discharged / unit.capacityKwh : null;
  return { charged, discharged, efficiency, equivalentCycles };
}

function BessTab({ selectedDate, setSelectedDate, bessEntry, setBessField, bessHistory, onSave, saving, loading }) {
  const [view, setView] = useState("entry"); // entry | trend

  // Cumulative equivalent-cycle count per unit, summed across all saved days.
  const cumulativeCycles = useMemo(() => {
    const totals = Object.fromEntries(BESS_UNITS.map((u) => [u.code, 0]));
    bessHistory.forEach((row) => {
      BESS_UNITS.forEach((u) => {
        const m = bessUnitMetrics(u, row.data?.[u.code]);
        if (m.equivalentCycles !== null) totals[u.code] += m.equivalentCycles;
      });
    });
    return totals;
  }, [bessHistory]);

  const trendSeries = bessHistory.map((row) => {
    const point = { date: fmtShort(row.date) };
    let totalCharged = 0, totalDischarged = 0;
    BESS_UNITS.forEach((u) => {
      const m = bessUnitMetrics(u, row.data?.[u.code]);
      point[`soc_${u.code}`] = row.data?.[u.code]?.socEnd ? num(row.data[u.code].socEnd) : null;
      totalCharged += m.charged;
      totalDischarged += m.discharged;
    });
    point.charged = totalCharged || null;
    point.discharged = totalDischarged || null;
    point.efficiency = totalCharged > 0 ? (totalDischarged / totalCharged) * 100 : null;
    return point;
  });

  if (BESS_UNITS.length === 0) {
    return <EmptyState icon={BatteryCharging} text="ยังไม่มีข้อมูลชุดแบตเตอรี่ในระบบ (Master data ว่าง)" />;
  }

  return (
    <div className="space-y-5">
      <Card padded={false} className="flex gap-1 p-1.5 w-fit">
        <button
          onClick={() => setView("entry")}
          className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-medium"
          style={view === "entry" ? { backgroundColor: `${NAVY}0F`, color: NAVY } : { color: MUTED }}
        >
          <ClipboardList size={14} /> บันทึกข้อมูลรายวัน
        </button>
        <button
          onClick={() => setView("trend")}
          className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-medium"
          style={view === "trend" ? { backgroundColor: `${NAVY}0F`, color: NAVY } : { color: MUTED }}
        >
          <TrendingUp size={14} /> แนวโน้ม &amp; รอบการใช้งาน
        </button>
      </Card>

      <Card className="text-xs" style={{ color: MUTED }}>
        <span className="flex items-center gap-1.5">
          <AlertTriangle size={13} color={AMBER} />
          รหัสชุดแบตเตอรี่ (BESS-A01 ฯลฯ) และค่า Capacity/Power ตอนนี้เป็นค่าตัวอย่างเริ่มต้น — แก้ไขให้ตรงกับป้าย nameplate จริงของระบบกักเก็บพลังงานในไฟล์ก่อนใช้งานจริง
        </span>
      </Card>

      {view === "entry" && (
        <>
          <Card className="flex items-center gap-3 flex-wrap">
            <Calendar size={16} color={MUTED} />
            <label className="text-sm" style={{ color: MUTED }}>วันที่บันทึก:</label>
            <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="border rounded px-2 py-1.5 text-sm" style={{ borderColor: BORDER }} />
          </Card>

          {loading ? (
            <EmptyState icon={BatteryCharging} text="กำลังโหลดข้อมูล..." />
          ) : (
            BESS_UNITS.map((unit) => {
              const ue = bessEntry[unit.code] || emptyBessUnitEntry();
              const m = bessUnitMetrics(unit, ue);
              return (
                <Card key={unit.code}>
                  <div className="flex items-center justify-between flex-wrap gap-2 mb-4">
                    <div>
                      <p className="text-sm font-semibold flex items-center gap-2" style={{ color: "#16232E" }}>
                        <BatteryCharging size={16} color={BESS_CATEGORY.color} /> {unit.code}
                      </p>
                      <p className="text-xs" style={{ color: MUTED }}>
                        โซน {unit.zone} · Capacity {unit.capacityKwh?.toLocaleString() ?? "N/A"} kWh · Power {unit.powerKw?.toLocaleString() ?? "N/A"} kW
                        {unit.note ? ` · ${unit.note}` : ""}
                      </p>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                    <div>
                      <label className="text-xs" style={{ color: MUTED }}>SOC เริ่มต้น (%)</label>
                      <input type="number" step="0.1" value={ue.socStart} onChange={(e) => setBessField(unit.code, "socStart", e.target.value)} placeholder="0-100" className="w-full mt-1 border rounded px-2.5 py-1.5 text-sm" style={{ borderColor: BORDER }} />
                    </div>
                    <div>
                      <label className="text-xs" style={{ color: MUTED }}>SOC สิ้นวัน (%)</label>
                      <input type="number" step="0.1" value={ue.socEnd} onChange={(e) => setBessField(unit.code, "socEnd", e.target.value)} placeholder="0-100" className="w-full mt-1 border rounded px-2.5 py-1.5 text-sm" style={{ borderColor: BORDER }} />
                    </div>
                    <div>
                      <label className="text-xs" style={{ color: MUTED }}>พลังงานชาร์จเข้า (kWh)</label>
                      <input type="number" step="0.01" value={ue.chargedKwh} onChange={(e) => setBessField(unit.code, "chargedKwh", e.target.value)} placeholder="0" className="w-full mt-1 border rounded px-2.5 py-1.5 text-sm" style={{ borderColor: BORDER }} />
                    </div>
                    <div>
                      <label className="text-xs" style={{ color: MUTED }}>พลังงานคายออก (kWh)</label>
                      <input type="number" step="0.01" value={ue.dischargedKwh} onChange={(e) => setBessField(unit.code, "dischargedKwh", e.target.value)} placeholder="0" className="w-full mt-1 border rounded px-2.5 py-1.5 text-sm" style={{ borderColor: BORDER }} />
                    </div>
                    <div>
                      <label className="text-xs" style={{ color: MUTED }}>อุณหภูมิเฉลี่ย (°C)</label>
                      <input type="number" step="0.1" value={ue.avgTemp} onChange={(e) => setBessField(unit.code, "avgTemp", e.target.value)} placeholder="N/A" className="w-full mt-1 border rounded px-2.5 py-1.5 text-sm" style={{ borderColor: BORDER }} />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-4">
                    <StatTile label="Round-trip Efficiency" value={m.efficiency !== null ? m.efficiency.toFixed(1) : "N/A"} unit={m.efficiency !== null ? "%" : ""} sub="คาย ÷ ชาร์จ × 100" />
                    <StatTile label="Equivalent Full Cycles (วันนี้)" value={m.equivalentCycles !== null ? m.equivalentCycles.toFixed(3) : "N/A"} sub="คายออก (kWh) ÷ Capacity (kWh)" />
                    <StatTile label="รอบสะสมทั้งหมด" value={(cumulativeCycles[unit.code] || 0).toFixed(1)} sub="ผลรวมทุกวันที่บันทึกไว้" />
                  </div>

                  <div className="mt-3">
                    <input
                      type="text" placeholder="หมายเหตุ (เช่น Alarm ที่พบ, เหตุการณ์ผิดปกติ)"
                      value={ue.note} onChange={(e) => setBessField(unit.code, "note", e.target.value)}
                      className="w-full border rounded px-2.5 py-1.5 text-xs" style={{ borderColor: BORDER }}
                    />
                  </div>
                </Card>
              );
            })
          )}

          <div className="flex justify-end">
            <button
              onClick={onSave}
              disabled={saving || loading}
              className="flex items-center gap-2 px-6 py-3 rounded-lg text-sm font-medium text-white disabled:opacity-60 shadow-sm"
              style={{ backgroundColor: NAVY }}
            >
              <Save size={16} />
              {saving ? "กำลังบันทึก..." : "บันทึกข้อมูล BESS ของวันนี้"}
            </button>
          </div>
        </>
      )}

      {view === "trend" && (
        <>
          <Card>
            <p className="text-sm font-semibold mb-4 flex items-center gap-2" style={{ color: "#16232E" }}>
              <TrendingUp size={16} color={NAVY} /> พลังงานชาร์จ/คายประจุ รวมทุกชุด
            </p>
            {trendSeries.filter((d) => d.charged !== null || d.discharged !== null).length === 0 ? (
              <EmptyState icon={TrendingUp} text="ยังไม่มีข้อมูลเพียงพอสำหรับกราฟ" />
            ) : (
              <ResponsiveContainer width="100%" height={240}>
                <ComposedChart data={trendSeries} margin={{ top: 5, right: 10, bottom: 0, left: -20 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#EEF1F4" />
                  <XAxis dataKey="date" tick={{ fontSize: 11, fill: MUTED }} />
                  <YAxis yAxisId="kwh" tick={{ fontSize: 11, fill: MUTED }} />
                  <YAxis yAxisId="eff" orientation="right" domain={[0, 100]} tick={{ fontSize: 11, fill: MUTED }} />
                  <Tooltip />
                  <Legend wrapperStyle={{ fontSize: 12 }} />
                  <Bar yAxisId="kwh" dataKey="charged" name="ชาร์จเข้า (kWh)" fill="#2C6FB0" radius={[4, 4, 0, 0]} />
                  <Bar yAxisId="kwh" dataKey="discharged" name="คายออก (kWh)" fill={AMBER} radius={[4, 4, 0, 0]} />
                  <Line yAxisId="eff" type="monotone" dataKey="efficiency" name="Round-trip Efficiency (%)" stroke={GREEN} strokeWidth={2} dot={{ r: 3 }} connectNulls />
                </ComposedChart>
              </ResponsiveContainer>
            )}
          </Card>

          <Card>
            <p className="text-sm font-semibold mb-4 flex items-center gap-2" style={{ color: "#16232E" }}>
              <BatteryCharging size={16} color={BESS_CATEGORY.color} /> SOC สิ้นวัน รายชุด
            </p>
            {trendSeries.length === 0 ? (
              <EmptyState icon={BatteryCharging} text="ยังไม่มีข้อมูล" />
            ) : (
              <ResponsiveContainer width="100%" height={220}>
                <LineChart data={trendSeries} margin={{ top: 5, right: 10, bottom: 0, left: -20 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#EEF1F4" />
                  <XAxis dataKey="date" tick={{ fontSize: 11, fill: MUTED }} />
                  <YAxis domain={[0, 100]} tick={{ fontSize: 11, fill: MUTED }} />
                  <Tooltip />
                  <Legend wrapperStyle={{ fontSize: 11 }} />
                  {BESS_UNITS.map((u, i) => (
                    <Line

                      stroke={["#2C6FB0", "#1F8A55", "#C0722A", "#6A4FA0", "#B0392C"][i % 5]}
                      strokeWidth={2} dot={{ r: 3 }} connectNulls
                    />
                  ))}
                </LineChart>
              </ResponsiveContainer>
            )}
          </Card>

          <Card padded={false} className="overflow-x-auto">
            <div className="px-5 pt-4 pb-1">
              <p className="text-sm font-semibold" style={{ color: "#16232E" }}>รอบการใช้งานสะสม (Equivalent Full Cycles) ต่อชุด</p>
              <p className="text-xs mt-0.5" style={{ color: MUTED }}>ผลรวมจากทุกวันที่บันทึกไว้ — ใช้ประกอบการประเมินอายุการใช้งานเทียบกับรอบที่ผู้ผลิตรับประกัน</p>
            </div>
            <table className="text-sm border-collapse w-full mt-2">
              <thead>
                <tr>
                  <th className="text-left px-4 py-2 text-xs font-semibold border-b" style={{ color: "#16232E", borderColor: BORDER }}>ชุดแบตเตอรี่</th>
                  <th className="text-right px-4 py-2 text-xs font-semibold border-b" style={{ color: "#16232E", borderColor: BORDER }}>รอบสะสม (Equivalent Cycles)</th>
                </tr>
              </thead>
              <tbody>
                {BESS_UNITS.map((u) => (
                  <tr key={u.code}>
                    <td className="px-4 py-2 border-b" style={{ borderColor: "#F0F2F5" }}>{u.code} <span style={{ color: MUTED }}>· โซน {u.zone}</span></td>
                    <td className="text-right px-4 py-2 border-b font-medium" style={{ borderColor: "#F0F2F5", color: "#16232E" }}>{(cumulativeCycles[u.code] || 0).toFixed(1)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </Card>
        </>
      )}
    </div>
  );
}

  return (
    <div className="bg-white rounded-xl border shadow-sm overflow-x-auto" style={{ borderColor: BORDER }}>
      <table className="w-full text-sm min-w-[640px]">
        <thead>
          <tr style={{ backgroundColor: NAVY }}>
            <th className="text-left px-4 py-2.5 text-white font-medium">วันที่</th>
            <th className="text-left px-4 py-2.5 text-white font-medium">สุขภาพระบบ</th>
            <th className="text-left px-4 py-2.5 text-white font-medium">Total Energy</th>
            <th className="text-left px-4 py-2.5 text-white font-medium">Peak Demand</th>

          </tr>
        </thead>
